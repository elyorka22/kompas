name: kompas
description: "Компас — AI Conversation Coach for real Russian speaking practice."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State & navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # Local database (offline-first source of truth)
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.4

  # Domain helpers
  equatable: ^2.0.5
  uuid: ^4.4.2
  intl: ^0.19.0
  collection: ^1.18.0

  # Design system typography
  google_fonts: ^6.2.1
  http: ^1.6.0
  shared_preferences: ^2.3.3

  # Offline voice input (Vosk). Vendored + SDK-patched for Flutter 3.22.3 /
  # Dart 3.4.4 — see third_party/vosk_flutter/README.md.
  vosk_flutter:
    path: third_party/vosk_flutter
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.11
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    # Place vosk-model-small-ru-0.22.zip here (see scripts/download_vosk_model.sh).
    - assets/models/

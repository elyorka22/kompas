allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

// whisper_flutter_new pins a beta NDK; force a stable r27c for app + plugins.
ext.kompasNdkVersion = "27.2.12479018"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Register before evaluationDependsOn — that call can evaluate projects early.
subprojects { subproject ->
    def applyNdk = {
        def androidExt = subproject.extensions.findByName("android")
        if (androidExt != null && androidExt.hasProperty("ndkVersion")) {
            androidExt.ndkVersion = rootProject.ext.kompasNdkVersion
        }
    }
    if (subproject.state.executed) {
        applyNdk()
    } else {
        subproject.afterEvaluate(applyNdk)
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

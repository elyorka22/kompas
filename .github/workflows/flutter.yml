name: Flutter

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Ensure local API key stub for CI
        run: |
          if [ ! -f lib/config/dev_api_key.dart ]; then
            cp lib/config/dev_api_key.dart.example lib/config/dev_api_key.dart
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: |
          flutter config --no-analytics
          flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

  build-android:
    needs: analyze-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Ensure local API key stub for CI
        run: |
          if [ ! -f lib/config/dev_api_key.dart ]; then
            cp lib/config/dev_api_key.dart.example lib/config/dev_api_key.dart
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: |
          flutter config --no-analytics
          flutter pub get

      - name: Setup Android NDK r27c
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT/licenses"
          printf '\n%s\n' "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "$SDK_ROOT/licenses/android-sdk-license"
          printf '\n%s\n' "84831b9409646a918e30573bab4c9c91346d8abd" \
            > "$SDK_ROOT/licenses/android-sdk-preview-license"
          # CMake version required by whisper_flutter_new.
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1 || true)"
          fi
          if [ -n "${SDKMANAGER:-}" ] && [ -x "$SDKMANAGER" ]; then
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "cmake;3.22.1" || true
          fi

      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kompas-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Where to install
        run: |
          echo "## Install Kompas" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Open this workflow run on GitHub Actions." >> "$GITHUB_STEP_SUMMARY"
          echo "2. Scroll to **Artifacts**." >> "$GITHUB_STEP_SUMMARY"
          echo "3. Download **kompas-android-apk**." >> "$GITHUB_STEP_SUMMARY"
          echo "4. Unzip and install \`app-release.apk\` on your Android phone." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub does not show an Install button — use the Artifacts download." >> "$GITHUB_STEP_SUMMARY"
